[project]
name = "swapshield-ml"
version = "1.0.0"
description = "Multimodal return-substitution verification for SwapShield AI"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gpu = [
  "torch>=2.6",
  "transformers>=4.57,<6",
  "pillow>=11",
  "numpy>=2.1",
  "accelerate>=1.3",
  "bitsandbytes>=0.45",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "python-multipart>=0.0.20",
  "python-dotenv>=1.0"
]
dev = ["pytest>=8.3", "ruff>=0.9"]
train = ["numpy>=2.1", "scikit-learn>=1.6,<2"]

[tool.ruff]
line-length = 110
target-version = "py311"
